apiVersion: apps/v1
kind: Deployment
metadata:
  name: teachcloud-api
  namespace: teachcloud-prod
  labels:
    app.kubernetes.io/name: teachcloud-api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: teachcloud-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teachcloud-api
    spec:
      containers:
        - name: api
          image: ghcr.io/dilshadgit/teachcloud-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: teachcloud-config
            - secretRef:
                name: teachcloud-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
